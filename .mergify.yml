queue_rules:
  - name: dague-lab-queue
    queue_conditions:
      - label = dague-queue-only
    merge_conditions:
      - label != dague-never-merge-xyz

pull_request_rules:
  - name: dague-lab-automerge
    conditions:
      - label = dague-never-merge
    actions:
      queue:
        name: dague-lab-queue
