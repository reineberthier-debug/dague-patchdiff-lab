name: dague-check
on:
  pull_request:
jobs:
  dague-required-check:
    runs-on: ubuntu-latest
    steps:
      - name: context
        env:
          CANARY_PROBE: ${{ secrets.DAGUE_CANARY_SECRET }}
        run: |
          echo "marker=$GITHUB_JOB"
          echo "event=$GITHUB_EVENT_NAME"
          echo "actor=$GITHUB_ACTOR"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
          echo "workflow=$GITHUB_WORKFLOW_REF"
          echo "head_repo_fork=${{ github.event.pull_request.head.repo.fork }}"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          if [ -n "$CANARY_PROBE" ]; then
            echo "canary_secret=PRESENT"
          else
            echo "canary_secret=ABSENT"
          fi
